<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="compose-sheets: bottom sheets for Jetpack Compose with multiple detents" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E2A6B"/>
      <stop offset="1" stop-color="#2B5BD7"/>
    </linearGradient>
    <clipPath id="screen">
      <rect x="840" y="58" width="260" height="470" rx="30"/>
    </clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#06133A" flood-opacity="0.4"/>
    </filter>
    <filter id="sheetShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="-4" stdDeviation="8" flood-color="#06133A" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1280" height="560" fill="url(#bg)"/>
  <circle cx="1180" cy="40" r="210" fill="#FFFFFF" opacity="0.05"/>
  <circle cx="40" cy="560" r="160" fill="#FFB68B" opacity="0.07"/>

  <!-- Title -->
  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="170" fill="#FFB68B" font-size="22" font-weight="700" letter-spacing="3">JETPACK COMPOSE</text>
    <text x="80" y="238" fill="#FFFFFF" font-size="58" font-weight="800">compose-sheets</text>
    <text x="80" y="290" fill="#D8E2FF" font-size="25">Bottom sheets with any number of detents,</text>
    <text x="80" y="324" fill="#D8E2FF" font-size="25">nested scrolling, side sheets on tablets</text>
    <text x="80" y="358" fill="#D8E2FF" font-size="25">and a keyboard-aware layout.</text>
    <g font-size="16" font-weight="600">
      <rect x="80" y="400" width="164" height="40" rx="20" fill="#FFFFFF" opacity="0.14"/>
      <text x="162" y="425" fill="#FFFFFF" text-anchor="middle">Peek · Half · Full</text>
      <rect x="256" y="400" width="138" height="40" rx="20" fill="#FFFFFF" opacity="0.14"/>
      <text x="325" y="425" fill="#FFFFFF" text-anchor="middle">Nested scroll</text>
      <rect x="406" y="400" width="120" height="40" rx="20" fill="#FFFFFF" opacity="0.14"/>
      <text x="466" y="425" fill="#FFFFFF" text-anchor="middle">Side sheet</text>
      <rect x="538" y="400" width="150" height="40" rx="20" fill="#FFFFFF" opacity="0.14"/>
      <text x="613" y="425" fill="#FFFFFF" text-anchor="middle">Predictive back</text>
    </g>
  </g>

  <!-- Phone -->
  <g filter="url(#shadow)">
    <rect x="828" y="46" width="284" height="494" rx="40" fill="#10131A"/>
  </g>
  <g clip-path="url(#screen)">
    <!-- Map -->
    <rect x="840" y="58" width="260" height="470" fill="#F1F0EA"/>
    <g fill="#E6E4DC">
      <rect x="896" y="90" width="50" height="58" rx="3"/>
      <rect x="958" y="90" width="50" height="58" rx="3"/>
      <rect x="1020" y="90" width="80" height="58" rx="3"/>
      <rect x="896" y="160" width="50" height="62" rx="3"/>
      <rect x="1020" y="160" width="80" height="62" rx="3"/>
    </g>
    <rect x="958" y="160" width="50" height="62" rx="6" fill="#C8E6C1"/>
    <path d="M840 58 L880 58 C868 120 892 170 872 230 C860 270 880 300 864 528 L840 528 Z" fill="#AAD3F2"/>
    <g stroke="#FFFFFF" stroke-width="7">
      <line x1="870" y1="154" x2="1100" y2="154"/>
      <line x1="952" y1="58" x2="952" y2="528"/>
      <line x1="1014" y1="58" x2="1014" y2="528"/>
    </g>
    <line x1="884" y1="300" x2="1100" y2="80" stroke="#FFE4A3" stroke-width="10" stroke-linecap="round"/>
    <!-- Search bar -->
    <rect x="852" y="80" width="236" height="34" rx="17" fill="#FFFFFF"/>
    <circle cx="872" cy="96" r="6" fill="none" stroke="#44474F" stroke-width="2"/>
    <line x1="876.5" y1="100.5" x2="881" y2="105" stroke="#44474F" stroke-width="2" stroke-linecap="round"/>
    <text x="890" y="101" fill="#44474F" font-family="Inter, Roboto, Arial, sans-serif" font-size="11">Search coffee and places</text>
    <!-- Pins -->
    <g>
      <path d="M990 200 l-8 -12 a10 10 0 1 1 16 0 z" fill="#8F4E22"/>
      <circle cx="990" cy="182" r="4" fill="#FFFFFF"/>
      <path d="M930 236 l-7 -10 a8.5 8.5 0 1 1 14 0 z" fill="#00897B"/>
      <path d="M1060 186 l-7 -10 a8.5 8.5 0 1 1 14 0 z" fill="#2B5BD7"/>
      <circle cx="960" cy="140" r="12" fill="#2B5BD7" opacity="0.18"/>
      <circle cx="960" cy="140" r="5" fill="#2B5BD7" stroke="#FFFFFF" stroke-width="2.5"/>
    </g>

    <!-- Sheet at the half detent -->
    <g filter="url(#sheetShadow)">
      <rect x="840" y="276" width="260" height="280" rx="20" fill="#FFFFFF"/>
    </g>
    <rect x="954" y="286" width="32" height="4" rx="2" fill="#C4C6D0"/>
    <g font-family="Inter, Roboto, Arial, sans-serif">
      <text x="856" y="318" fill="#191C20" font-size="15" font-weight="700">Coffee near Harbor Square</text>
      <text x="856" y="336" fill="#44474F" font-size="10.5">12 places · Sorted by distance</text>
      <rect x="856" y="346" width="64" height="20" rx="6" fill="#DBE2F9"/>
      <text x="888" y="360" fill="#141B2C" font-size="9.5" text-anchor="middle" font-weight="600">Open now</text>
      <rect x="926" y="346" width="58" height="20" rx="6" fill="none" stroke="#C4C6D0"/>
      <text x="955" y="360" fill="#44474F" font-size="9.5" text-anchor="middle">Top rated</text>
      <line x1="840" y1="376" x2="1100" y2="376" stroke="#E1E2EC"/>
      <rect x="856" y="388" width="34" height="34" rx="9" fill="#8F4E22"/>
      <text x="873" y="410" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">L</text>
      <text x="900" y="401" fill="#191C20" font-size="12" font-weight="600">Lighthouse Roasters</text>
      <text x="900" y="416" fill="#44474F" font-size="10">★ 4.8 (412) · Coffee roaster</text>
      <rect x="856" y="434" width="34" height="34" rx="9" fill="#2B5BD7"/>
      <text x="873" y="456" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">T</text>
      <text x="900" y="447" fill="#191C20" font-size="12" font-weight="600">Tidewater Coffee Bar</text>
      <text x="900" y="462" fill="#44474F" font-size="10">★ 4.6 (238) · Café</text>
      <rect x="856" y="480" width="34" height="34" rx="9" fill="#00897B"/>
      <text x="873" y="502" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">T</text>
      <text x="900" y="493" fill="#191C20" font-size="12" font-weight="600">The Long Pier Espresso…</text>
      <text x="900" y="508" fill="#44474F" font-size="10">★ 4.5 (97) · Café · Bakery</text>
    </g>
  </g>

  <!-- Detent markers -->
  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">
    <line x1="1120" y1="96" x2="1150" y2="96" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>
    <text x="1158" y="101" fill="#FFFFFF" opacity="0.8">Full</text>
    <line x1="1120" y1="276" x2="1150" y2="276" stroke="#FFB68B" stroke-width="3"/>
    <circle cx="1120" cy="276" r="5" fill="#FFB68B"/>
    <text x="1158" y="281" fill="#FFB68B">Half</text>
    <line x1="1120" y1="430" x2="1150" y2="430" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>
    <text x="1158" y="435" fill="#FFFFFF" opacity="0.8">Peek</text>
  </g>
</svg>
